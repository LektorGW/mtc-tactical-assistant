[workspace]
resolver = "2"
members = ["crates/maps", "crates/profiles", "crates/ballistics", "crates/capture", "crates/vision", "crates/assets", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_WinRT"] }

[profile.release]
strip = true
lto = "thin"

